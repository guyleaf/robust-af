__include__:
  [
    "../base/dataset/coco_detection.yml",
    "../common/runtime.yml",
    "../common/robust_dataloader.yml",
    "../common/optimizer.yml",
    "../common/models/robust_rtdetrv2_r18vd.yml",
  ]

output_dir: ./output/rtdetrv2_r18vd/coco/robust_rtdetrv2_r18vd_50e_no_color_augs_in_clear

MultiScaleProcessor:
  modules:
    - { type: AMFGv2, embed_dims: 128, spatial_attention: 1 }
    - { type: AMFGv2, embed_dims: 256, spatial_attention: 1 }
    - { type: AMFGv2, embed_dims: 512, spatial_attention: 1 }

epoches: 50

optimizer:
  type: AdamW
  params:
    - params: "^(?=.*(?:norm|bn|BN|IN)).*$"
      weight_decay: 0.

# lr_scheduler:
#   type: MultiStepLR
#   milestones: [100]
#   gamma: 0.1

train_dataloader:
  dataset:
    transforms:
      policy:
        epoch: 47
  collate_fn:
    scales: ~
