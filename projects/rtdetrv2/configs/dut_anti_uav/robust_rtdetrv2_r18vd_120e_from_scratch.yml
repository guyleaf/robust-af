__include__:
  [
    "../common/dataset/dut_anti_uav_degraded_detection.yml",
    "../common/runtime.yml",
    "../common/robust_dataloader.yml",
    "../common/optimizer.yml",
    "../common/models/robust_rtdetrv2_r18vd.yml",
  ]

output_dir: ./output/rtdetrv2_r18vd/dut_anti_uav/robust_rtdetrv2_r18vd_120e_from_scratch_no_color_augs_in_clear

RobustRTDETR:
  train_all: true
  robust_image_module: ~
  robust_module: ~

PResNet:
  freeze_at: -1
  freeze_norm: false

# MultiScaleProcessor:
#   modules:
#     - { type: SpatialAFR, embed_dims: 128, activation: ReLU }
#     - { type: SpatialAFR, embed_dims: 256, activation: ReLU }
#     - { type: SpatialAFR, embed_dims: 512, activation: ReLU }

RobustCriterion:
  image_cst_loss: ~
  cst_loss: ~
  weight_dict:
    loss_image_cst: 20
    loss_cst: 20

# criterion: RobustCriterionv2
# RobustCriterionv2:
#   model_loss: RTDETRCriterionv2
#   content_loss:
#     type: MSELoss
#     reduction: none
#   style_loss:
#     type: MSELoss
#     reduction: none
#   weight_dict:
#     loss_content: 20
#     loss_style: 20

epoches: 120

optimizer:
  type: AdamW
  params:
    - params: "^(?=.*(?:norm|bn|BN|IN)).*$"
      weight_decay: 0.

train_dataloader:
  dataset:
    transforms:
      ops:
        # - { type: RandomPhotometricDistort, p: 0.5 }
        - { type: RandomZoomOut, fill: 0 }
        - { type: RandomIoUCrop, p: 0.8 }
        - { type: SanitizeBoundingBoxes, min_size: 1 }
        - { type: RandomHorizontalFlip }
        - { type: Resize, size: [640, 640] }
        - { type: SanitizeBoundingBoxes, min_size: 1 }
        - { type: ConvertPILImage, dtype: "float32", scale: True }
        - { type: ConvertBoxes, fmt: "cxcywh", normalize: True }
      policy:
        # ops: ["RandomPhotometricDistort", "RandomZoomOut", "RandomIoUCrop"]
        ops: ["RandomZoomOut", "RandomIoUCrop"]
        epoch: 117
  collate_fn:
    scales: ~
