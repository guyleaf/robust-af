__include__:
  [
    "../common/dataset/dut_anti_uav_detection.yml",
    "../common/runtime.yml",
    "../common/dataloader.yml",
    "../common/optimizer.yml",
    "../common/models/rtdetrv2_r34vd.yml",
  ]

output_dir: ./output/rtdetrv2_r34vd/dut_anti_uav/rtdetrv2_r34vd_144e

epoches: 144

optimizer:
  type: AdamW
  params:
    - params: "^(?=.*backbone)(?!.*norm|bn).*$"
      lr: 0.00005
    - params: "^(?=.*backbone)(?=.*norm|bn).*$"
      lr: 0.00005
      weight_decay: 0.
    - params: "^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn|bias)).*$"
      weight_decay: 0.

  lr: 0.0001
  betas: [0.9, 0.999]
  weight_decay: 0.0001

train_dataloader:
  dataset:
    transforms:
      policy:
        epoch: 141
  collate_fn:
    stop_epoch: 141
