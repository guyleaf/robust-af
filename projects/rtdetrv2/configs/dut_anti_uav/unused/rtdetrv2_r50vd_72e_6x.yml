__include__:
  [
    "../common/dataset/dut_anti_uav_detection.yml",
    "../common/runtime.yml",
    "../common/dataloader.yml",
    "../common/optimizer.yml",
    "../common/models/rtdetrv2_r50vd.yml",
  ]

output_dir: ./output/rtdetrv2_r50vd/dut_anti_uav/rtdetrv2_r50vd_72e_6x_from_pretrained

# PResNet:
  # freeze_at: -1
  # freeze_norm: False
  # pretrained: True

optimizer:
  type: AdamW
  params:
    - params: "^(?=.*backbone)(?!.*norm).*$"
      lr: 0.00001
    - params: "^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn)).*$"
      weight_decay: 0.
    # - params: "^(?=.*backbone)(?!.*norm|bn).*$"
    #   lr: 0.00005
    # - params: "^(?=.*backbone)(?=.*norm|bn).*$"
    #   lr: 0.00005
    #   weight_decay: 0.
    # - params: "^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn|bias)).*$"
    #   weight_decay: 0.

  lr: 0.0001
  betas: [0.9, 0.999]
  weight_decay: 0.0001
