__include__:
  [
    "../common/dataset/dut_anti_uav_detection.yml",
    "../common/runtime.yml",
    "../common/dataloader.yml",
    "../common/optimizer.yml",
    "../common/models/rtdetrv2_r50vd.yml",
  ]

output_dir: ./output/rtdetrv2_r50vd/dut_anti_uav/rtdetrv2_r50vd_120e_m_7x_r18vd_optim

HybridEncoder:
  expansion: 0.5

RTDETRTransformerv2:
  eval_idx: 2 # use 3th decoder layer to eval

epoches: 120

optimizer:
  type: AdamW
  params:
    # - params: "^(?=.*backbone)(?!.*norm).*$"
    #   lr: 0.00001
    # - params: "^(?=.*backbone)(?=.*norm).*$"
    #   lr: 0.00001
    #   weight_decay: 0.
    # - params: "^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn)).*$"
    #   weight_decay: 0.
    - params: "^(?=.*(?:norm|bn)).*$"
      weight_decay: 0.

  lr: 0.0001
  betas: [0.9, 0.999]
  weight_decay: 0.0001

train_dataloader:
  dataset:
    transforms:
      policy:
        epoch: 117
  collate_fn:
    stop_epoch: 117
