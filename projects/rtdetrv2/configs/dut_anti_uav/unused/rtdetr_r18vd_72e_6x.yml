__include__:
  [
    "../common/dataset/dut_anti_uav_detection.yml",
    "../common/runtime.yml",
    "../base/rtdetr/include/dataloader.yml",
    "../base/rtdetr/include/optimizer.yml",
    "../base/rtdetr/include/rtdetr_r50vd.yml",
  ]

output_dir: ./output/rtdetr_r18vd/dut_anti_uav/rtdetr_r18vd_72e_6x

PResNet:
  depth: 18
  freeze_at: -1
  freeze_norm: False
  pretrained: True

HybridEncoder:
  in_channels: [128, 256, 512]
  hidden_dim: 256
  expansion: 0.5

RTDETRTransformer:
  num_layers: 3

optimizer:
  type: AdamW
  params:
    - params: "^(?=.*backbone)(?=.*norm|bn).*$"
      weight_decay: 0.
      lr: 0.00001
    - params: "^(?=.*backbone)(?!.*norm|bn).*$"
      lr: 0.00001
    - params: "^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn|bias)).*$"
      weight_decay: 0.

  lr: 0.0001
  betas: [0.9, 0.999]
  weight_decay: 0.0001

# same as val_dataloader
val_train_dataloader:
  dataset:
    transforms:
      ops:
        - { type: Resize, size: [640, 640] }
        - { type: ConvertPILImage, dtype: "float32", scale: True }
  shuffle: False
  total_batch_size: 32
  num_workers: 4
