__include__:
  [
    "../common/dataset/dut_anti_uav_detection.yml",
    "../common/runtime.yml",
    "../common/dataloader.yml",
    "../common/optimizer.yml",
    "../common/models/rtdetrv2_r101vd.yml",
  ]

output_dir: ./output/rtdetrv2_r101vd/dut_anti_uav/rtdetrv2_r101vd_72e_6x

optimizer:
  type: AdamW
  params:
    - params: "^(?=.*backbone)(?!.*norm|bn).*$"
      lr: 0.000001
    - params: "^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn)).*$"
      weight_decay: 0.

  lr: 0.0001
  betas: [0.9, 0.999]
  weight_decay: 0.0001
