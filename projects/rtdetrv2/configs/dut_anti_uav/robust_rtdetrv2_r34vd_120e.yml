__include__: [
    "../common/dataset/dut_anti_uav_degraded_detection.yml",
    "../common/runtime.yml",
    "../common/robust_dataloader.yml",
    "../common/optimizer.yml",
    "../common/models/robust_rtdetrv2_r34vd.yml",
  ]

output_dir: ./output/rtdetrv2_r34vd/dut_anti_uav/robust_rtdetrv2_r34vd_120e_simple_nn_no_train_heads_no_color_augs_in_clear

RobustRTDETR:
  train_heads: False

MultiScaleProcessor:
  modules:
    - { type: SimpleNN, embed_dims: 128 }
    - { type: SimpleNN, embed_dims: 256 }
    - { type: SimpleNN, embed_dims: 512 }

# criterion: RobustCriterionDebug
