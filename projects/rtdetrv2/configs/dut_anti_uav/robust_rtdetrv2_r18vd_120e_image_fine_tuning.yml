__include__:
  [
    "../common/dataset/dut_anti_uav_degraded_detection.yml",
    "../common/runtime.yml",
    "../common/robust_dataloader.yml",
    "../common/optimizer.yml",
    "../common/models/robust_rtdetrv2_r18vd.yml",
  ]

output_dir: ./output/rtdetrv2_r18vd/dut_anti_uav/robust_rtdetrv2_r18vd_120e_1e-4_lr_gdip_multi_level_fine_tuning_no_color_augs_in_clear

RobustRTDETR:
  train_all: true
  # train_heads: False
  # robust_image_module: DENet
  # robust_image_module: DIP
  robust_image_module: GDIP
  robust_module: ~

PResNet:
  freeze_at: -1
  freeze_norm: false

# DENet:
#   # original code bug: mm1 used for all 4 branches
#   # compat_mode=True => their config in source code
#   # compat_mode=False => their config in paper
#   compat_mode: false

GDIP:
  multi_level: true

RobustCriterion:
  # image_cst_loss:
  #   type: MSELoss
  #   reduction: none
  image_cst_loss: ~
  cst_loss: ~
  weight_dict:
    loss_image_cst: 20
    loss_cst: 20

epoches: 120

optimizer:
  type: AdamW
  lr: 0.0001
  params:
    - params: "^(?=.*(?:norm|bn|BN|IN)).*$"
      weight_decay: 0.

# lr_scheduler:
#   type: MultiStepLR
#   milestones: [100]
#   gamma: 0.1

train_dataloader:
  dataset:
    transforms:
      policy:
        epoch: 117
  collate_fn:
    scales: ~
