checkpoint: /home/leafying/data/checkpoints/rtdetrv2/rtdetrv2_r18vd/dut_anti_uav/robust_rtdetrv2_r18vd_50e_5e-4_lr_spatial_afr_relu_no_train_heads_mixed_selection/best.pth
name: robust_rtdetrv2_r18vd_50e_5e-4_lr_spatial_afr_relu_no_train_heads_mixed_selection
max_runs: 2

# environmental variables
# tip: check the content of test.sh
envs:
  GPUS: 4

# config
root: configs/dut_anti_uav/test
dataset_root: configs/common/dataset
prefix: robust_rtdetrv2_r18vd
# prefix: robust_rtdetrv2_r18vd_image
# prefix: robust_rtdetrv2_r34vd
configs:
  - name: dut_anti_uav
    # subset keys are customizable
    # accept absolute or relative path to dataset_root
    subsets:
      val: dut_anti_uav_detection.yml
      val_degraded: dut_anti_uav_degraded_detection.yml
      test: dut_anti_uav_test_detection.yml
      test_degraded: dut_anti_uav_test_degraded_detection.yml
  - name: uav_eagle
    subsets:
      test: uav_eagle_detection.yml
      test_degraded: uav_eagle_degraded_detection.yml
  - name: robust_anti_uav_low
    subsets:
      test: robust_anti_uav_low_detection.yml
      test_degraded: robust_anti_uav_low_degraded_detection.yml
  - name: dds
    subsets:
      test: dds_detection.yml
      test_degraded: dds_degraded_detection.yml

#############################################################################

# custom settings below will be merged into the config
# NOTE: Be careful! Make sure setting full config. Otherwise, you may encounter any side effects from test configs.
use_ema: True

# RobustRTDETR:
#   robust_image_module: ~
#   robust_module: ~

############## image-level adapters ###########

# RobustRTDETR:
#   # robust_image_module: DENet
#   robust_image_module: DIP
#   # robust_image_module: GDIP
#   robust_module: ~

# DENet:
#   # original code bug: mm1 used for all 4 branches
#   # compat_mode=True => their config in source code
#   # compat_mode=False => their config in paper
#   compat_mode: false

# GDIP:
#   multi_level: false
#   # multi_level: true

############## feature-level adapters ###########

RobustRTDETR:
  robust_image_module: ~
  robust_module: MultiScaleProcessor

# MultiScaleProcessor:
#   modules:
#     - { type: SimpleNN, embed_dims: 128, activation: LeakyReLU }
#     - { type: SimpleNN, embed_dims: 256, activation: LeakyReLU }
#     - { type: SimpleNN, embed_dims: 512, activation: LeakyReLU }

MultiScaleProcessor:
  modules:
    - { type: SpatialAFR, embed_dims: 128, activation: ReLU }
    - { type: SpatialAFR, embed_dims: 256, activation: ReLU }
    - { type: SpatialAFR, embed_dims: 512, activation: ReLU }
