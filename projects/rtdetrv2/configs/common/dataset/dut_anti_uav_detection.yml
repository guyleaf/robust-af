task: detection

evaluator:
  type: CocoEvaluator
  iou_types: ["bbox"]

# num_classes: 365
# remap_mscoco_category: False

# num_classes: 91
# remap_mscoco_category: False

num_classes: 1
remap_mscoco_category: False

train_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetectionv2
    img_folder: ./dataset/DUT_Anti_UAV/detection/images/
    ann_file: ./dataset/DUT_Anti_UAV/detection/annotations/train.json
    return_masks: False
    transforms:
      type: Compose
      ops: ~
  shuffle: True
  num_workers: 4
  drop_last: True
  collate_fn:
    type: BatchImageCollateFunction

val_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetectionv2
    img_folder: ./dataset/DUT_Anti_UAV/detection/images/
    ann_file: ./dataset/DUT_Anti_UAV/detection/annotations/val.json
    return_masks: False
    transforms:
      type: Compose
      ops: ~
  shuffle: False
  num_workers: 4
  drop_last: False
  collate_fn:
    type: BatchImageCollateFunction

val_train_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetectionv2
    img_folder: ./dataset/DUT_Anti_UAV/detection/images/
    ann_file: ./dataset/DUT_Anti_UAV/detection/annotations/train.json
    return_masks: False
    transforms:
      type: Compose
      ops: ~
  shuffle: False
  num_workers: 4
  drop_last: False
  collate_fn:
    type: BatchImageCollateFunction
