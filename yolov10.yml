name: yolov10
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.9
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu118
      - torch==2.0.1
      - torchvision==0.15.2
      - numpy<2
      - wandb
      - -e .
variables:
  # GPUS: 4
  # surpress the warning
  NO_ALBUMENTATIONS_UPDATE: 1
