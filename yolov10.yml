name: yolov10
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.9
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu118
      - torch==2.0.1
      - torchvision==0.15.2
      - numpy<2
      - wandb
      - -e .
variables:
  GPUS: 4
  # helper variable for setting workdir in configs
  R_U2U_OD_WORKDIR: ~/work/work_dirs/yolov10
