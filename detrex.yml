name: detrex
channels:
  - nvidia/label/cuda-11.7.1
  - conda-forge
  - defaults
dependencies:
  - python=3.9
  # required by detectron2 and detrex
  - cuda-toolkit
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu117
      # avoid ModuleNotFoundError: No module named 'torch' error while buiding detectron2
      - setuptools<80
      - torch==1.13.1
      - torchvision==0.14.1
      - numpy<2
      - wandb
      - tensorboard
      # for analysis
      - scikit-learn~=1.6.1
      - -e .[baseline]
variables:
  GPUS: 4
  # set the default explicitly to let user modify it easily by shell completions.
  DETECTRON2_DATASETS: datasets
  # register our classes before detectron2
  DETECTRON2_ENV_MODULE: robust_af.detrex
  # surpress the warning
  NO_ALBUMENTATIONS_UPDATE: 1
  # disable TF32 to get consistent results between old and Ampere (and later) GPU devices
  # if you always use Ampere (and later) GPU, you can comment out or unset it (NOTE: unset => Defaults to the library and framework settings).
  # https://developer.nvidia.com/blog/accelerating-ai-training-with-tf32-tensor-cores/#global_platform_control
  NVIDIA_TF32_OVERRIDE: 0
