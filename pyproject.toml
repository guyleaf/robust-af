[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "robust_au_od"
authors = [{ name = "Leaf Ying", email = "leaf.ying.work@gmail.com" }]
readme = "README.md"
requires-python = ">=3.9"
version = "0.0.1"

dependencies = [
    "numpy < 3",
    "torch >= 1.13.1",
    "torchvision >= 0.14.1",
    "pycocotools",
    "rich",
    "albumentations ~= 1.4.24",
    "imaug ~= 0.4.1",
    "opencv-python < 5",
]

[project.optional-dependencies]
dev = [
    "mkdocs",
    "mkdocs-material",
    "mkdocs-git-revision-date-localized-plugin",
    "mkdocs-git-authors-plugin",
    "mkdocs-glightbox",
]

[tool.hatch.build.targets.wheel]
only-packages = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "NPY201"]
